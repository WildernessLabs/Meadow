name: Build OS and RT

on:
  repository_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Build Docker image for the OS build.
      run: docker build -t nuttx-build -f ./DockerFiles/Build/Dockerfile .

    - name: Build the OS and RT
      run: docker run --rm -v $GITHUB_WORKSPACE:/project -w /project --user "root:root" nuttx-build ./build.sh --force --clean
