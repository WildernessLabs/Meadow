adapter_khz 2000
source [find board/esp32-wrover-kit-3.3v.cfg]

init
halt

set basepath Meadow-ESP32/Source/MeadowComms/build
set image $basepath/partition_table/partition-table.bin
program_esp32 $image 0x8000

set image $basepath/bootloader/bootloader.bin
program_esp32 $image 0x1000

set image $basepath/MeadowComms.bin
program_esp32 $image 0x10000
esp32 appimage_offset 0x10000

reset halt
exit
