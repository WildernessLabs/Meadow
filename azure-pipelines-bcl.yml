# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - main
    - meadow-*

pool: "WL-Linux"

steps:
- script: |
    git clean -xffd
  displayName: 'Clean workspace'
  
- task: ShellScript@2
  inputs:
    scriptPath: checkout-submodules.sh
  displayName: 'Checkout submodules'

- script: |
    ./build-managed-assemblies.sh --clean --force
  displayName: 'Build and package managed assemblies'

- task: CopyFiles@2
  inputs:
    contents: |
      artifacts/meadow_assemblies/*.dll
    targetFolder: "$(Build.ArtifactStagingDirectory)/meadow_assemblies"
    flattenFolders: true

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: "$(Build.ArtifactStagingDirectory)"
    artifactName: BCL
