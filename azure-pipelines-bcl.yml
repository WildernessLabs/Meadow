# Meadow.Assemblies pipeline
# Builds the .NET 10 framework + System.Private.CoreLib targeted at our
# NuttX runtime. Output is the meadow_assemblies/ collection that ships
# alongside Meadow.OS.bin in a release — apps deployed via `meadow app run`
# link against these custom assemblies.

trigger:
  branches:
    include:
    - main
    - meadow-*

pool: "WL-Linux"

steps:
- script: |
    git clean -xffd
  displayName: 'Clean workspace'

- task: ShellScript@2
  inputs:
    scriptPath: checkout-submodules.sh
  displayName: 'Checkout submodules'

- script: |
    ./build-managed-assemblies.sh --clean --force
  displayName: 'Build and package managed assemblies'

- task: CopyFiles@2
  inputs:
    contents: |
      artifacts/meadow_assemblies/*.dll
    targetFolder: "$(Build.ArtifactStagingDirectory)/meadow_assemblies"
    flattenFolders: true

- task: PublishBuildArtifacts@1
  inputs:
    pathtoPublish: "$(Build.ArtifactStagingDirectory)"
    artifactName: BCL
