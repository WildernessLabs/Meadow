# Meadow pipeline
# Reference: https://aka.ms/yaml

trigger:
  - main
  - meadow-*

pool: "Default"

jobs:
  - job: default
    timeoutInMinutes: 240
    steps:
    # - task: AzureKeyVault@1
    #   inputs:
    #     azureSubscription: "Pay-As-You-Go (03334411-614e-4e9d-9a05-eada1b4e1fe6)"
    #     KeyVaultName: "wildernesslabs-devops"
    #     SecretsFilter: "*"
    # - script: echo $(aws-access-key-id)
    - task: ShellScript@2
      inputs:
        scriptPath: checkout-submodules.sh
    - task: ShellScript@2
      inputs:
        scriptPath: build.sh
        args: "--verbose"
    - task: CopyFiles@2
      inputs:
        contents: |
          nuttx/Meadow.OS.bin
          nuttx/Meadow.OS.Runtime.bin
          nuttx/build-info.json
        targetFolder: "$(Build.ArtifactStagingDirectory)/full"
        flattenFolders: true
  
    - task: CopyFiles@2
      inputs:
        contents: |
          nuttx/Meadow.OS.NoBL.bin
          nuttx/Meadow.OS.Runtime.bin
          nuttx/build-info.json
        targetFolder: "$(Build.ArtifactStagingDirectory)/ota"
        flattenFolders: true
    - task: CopyFiles@2
      inputs:
        contents: |
          mono/netcore/System.Private.CoreLib/bin/arm/System.Private.CoreLib.dll
          mono/netcore/System.Private.CoreLib/bin/arm/System.Private.CoreLib.pdb
          mono/netcore/System.Private.CoreLib/bin/arm/armSystem.Private.CoreLib.xml
        targetFolder: "$(Build.ArtifactStagingDirectory)"
        flattenFolders: true
    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: "$(Build.ArtifactStagingDirectory)/full"
        artifactName: Meadow.OS
    - task: PublishBuildArtifacts@1
      inputs:
        pathtoPublish: "$(Build.ArtifactStagingDirectory)/ota"
        artifactName: Meadow.OS OTA
